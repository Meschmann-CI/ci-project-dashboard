<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- macOS and iOS use their own SF Pro and never fetch this. Windows falls to Inter. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="atmosphere" aria-hidden="true"></div>

<header class="hero">
  <div class="hero-text">
    <div class="eyebrow" id="today"></div>
    <h1 id="greeting">Mission control<span class="period">.</span></h1>
    <p class="summary" id="summary">Loading…</p>
  </div>
  <div class="hero-actions">
    <button id="scanStatus" class="pill pill-status" title="Rescan">
      <span class="radar" aria-hidden="true"></span><span class="scan-text">…</span>
    </button>
    <button id="newBtn" class="pill pill-solid">＋ New project</button>
  </div>
</header>

<nav class="toolbar">
  <div class="seg" id="viewSeg" role="tablist">
    <button data-view="tiles" class="on" role="tab">Home</button>
    <button data-view="queue" role="tab">Needs you <span class="count" id="queueCount">0</span></button>
    <button data-view="board" role="tab">Board</button>
    <button data-view="done" role="tab" title="Everything ticked off, by day">Done <span class="count good" id="doneCount">0</span></button>
    <button data-view="suggested" role="tab" title="Updates your outside work suggests. Review and apply.">Suggested <span class="count" id="sugCount" hidden>0</span></button>
  </div>
  <span class="grow"></span>
  <div class="menu-wrap">
    <button id="filterBtn" class="pill pill-quiet" type="button" aria-haspopup="true" aria-expanded="false">
      <span id="filterLabel">All kinds</span><span class="caret" aria-hidden="true">▾</span>
    </button>
    <div id="filterMenu" class="menu" hidden>
      <div class="menu-h">Kind</div>
      <div class="menu-list" id="kindChips"></div>
      <div class="menu-h">Sort</div>
      <div class="menu-list" id="sortList"></div>
      <label class="menu-check"><input type="checkbox" id="showArchived"> Show archived projects</label>
    </div>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search or jump to…" autocomplete="off" aria-label="Search or jump to a project">
    <kbd>Ctrl K</kbd>
    <div id="jump" class="jump" role="listbox" hidden></div>
  </div>
</nav>

<main>
  <section id="viewTiles" class="view">
    <div id="upnext" class="upnext" hidden></div>
    <div id="tiles" class="bands"></div>
  </section>

  <section id="viewQueue" class="view" hidden>
    <div id="queue" class="queue"></div>
  </section>

  <section id="viewBoard" class="view" hidden>
    <div id="board" class="board"></div>
  </section>

  <section id="viewDone" class="view" hidden>
    <div id="done" class="done"></div>
  </section>

  <section id="viewSuggested" class="view" hidden>
    <div id="suggested" class="suggested"></div>
  </section>
</main>

<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Project detail"></aside>
<div id="toast" class="toast" hidden></div>

<script src="/glyphs.js"></script>
<script src="/app.js"></script>
</body>
</html>
